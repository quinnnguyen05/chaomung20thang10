<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chúc mừng 20/10 🌸</title>
<meta name="theme-color" content="#FFE3EA">
<meta property="og:title" content="Có một bó hoa nhỏ đang chờ bạn 🌸">
<meta property="og:description" content="Mở thiệp ra xem nhé.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --blush: #FFF1F3;
    --petal: #FFC9D6;
    --rose: #EE6C8B;
    --rose-deep: #C23A63;
    --lilac: #DCCBF7;
    --mint: #CDEFE2;
    --butter: #FFE9A8;
    --plum: #5A3B4B;
    --ink: #5A3B4B;
    --ink-soft: #84606F;
    --paper: #FFFDFB;
    --font-script: "Pacifico", "Quicksand", cursive;
    --font-body: "Quicksand", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; scroll-padding-top: 68px; }
  body {
    font-family: var(--font-body); color: var(--ink); -webkit-font-smoothing: antialiased; overflow-x: hidden;
    background: radial-gradient(circle at 1px 1px, rgba(238, 108, 139, .12) 1px, transparent 0) 0 0 / 22px 22px, #FFF1F3;
  }
  body.locked, body.sheet-open { overflow: hidden; }
  body.locked { height: 100vh; }
  img { max-width: 100%; }
  button { font-family: inherit; }
  :focus-visible { outline: 3px solid var(--rose-deep); outline-offset: 3px; }
  .wrap { width: min(100% - 40px, 1040px); margin-inline: auto; }
  section { position: relative; }
  .sec { padding: clamp(64px, 11vw, 108px) 0; }
  h2.title { font-family: var(--font-script); font-weight: 400; text-align: center; font-size: clamp(1.9rem, 6.2vw, 2.8rem); line-height: 1.35; color: var(--rose-deep); }
  .lead { max-width: 34em; margin: 12px auto 0; text-align: center; font-weight: 600; line-height: 1.8; color: var(--ink-soft); }

  .btn { font: 700 1rem/1 var(--font-body); padding: 14px 26px; border-radius: 999px; border: 2px solid transparent; cursor: pointer; transition: transform .15s ease, background .2s ease; }
  .btn:active { transform: scale(.96); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn-primary { background: var(--rose-deep); color: #fff; box-shadow: 0 8px 18px rgba(194, 58, 99, .28); }
  .btn-primary:hover:not(:disabled) { background: #AE3057; }
  .btn-soft { background: #fff; color: var(--rose-deep); border-color: var(--petal); }
  .link-btn { display: block; margin: 10px auto 0; background: none; border: 0; color: var(--ink-soft); font: 600 .9rem var(--font-body); text-decoration: underline; cursor: pointer; }

  /* ---------- Cánh hoa rơi ---------- */
  .petals { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .petal { position: absolute; top: -6vh; left: var(--l); width: var(--s); height: var(--s); background: var(--c); opacity: .6; border-radius: 150% 0 150% 0; animation: fall var(--d) linear var(--delay) infinite; }
  @keyframes fall { from { transform: translate3d(0, -8vh, 0) rotate(0); } to { transform: translate3d(var(--x), 112vh, 0) rotate(540deg); } }

  /* ---------- Thiệp mở đầu ---------- */
  .intro {
    position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px;
    background: radial-gradient(circle at 1px 1px, rgba(238, 108, 139, .14) 1px, transparent 0) 0 0 / 22px 22px, linear-gradient(160deg, #FFE3EA 0%, #FFF1F3 50%, #EADDFB 100%);
    transition: opacity .9s ease;
  }
  .intro.hide { opacity: 0; pointer-events: none; }
  .intro-note { color: var(--ink-soft); font-weight: 600; text-align: center; line-height: 1.7; }
  .intro-note small { font-weight: 600; font-size: .85rem; }
  .card3d { position: relative; width: min(74vw, 310px); aspect-ratio: 3 / 4; perspective: 1700px; }
  .card3d:not(.open) { animation: wobble 4.5s ease-in-out infinite; }
  @keyframes wobble { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(1.2deg); } }
  .card-inside {
    position: absolute; inset: 0; border-radius: 6px 18px 18px 6px; background: var(--paper);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 26px; text-align: center;
    box-shadow: 0 18px 40px rgba(194, 58, 99, .25);
  }
  .card-inside::before { content: ""; position: absolute; inset: 10px; border-radius: 4px 12px 12px 4px; border: 1.5px dashed var(--petal); }
  .in-big { font-family: var(--font-script); font-size: 1.7rem; color: var(--rose-deep); line-height: 1.4; }
  .in-line { font-weight: 600; line-height: 1.7; color: var(--ink-soft); }
  .card-cover {
    position: absolute; inset: 0; padding: 0; border: 0; background: none; cursor: pointer; color: inherit;
    transform-origin: left center; transform-style: preserve-3d; transition: transform 1.4s cubic-bezier(.5, 0, .2, 1);
  }
  .card3d.open .card-cover { transform: rotateY(-172deg); cursor: default; }
  .face { position: absolute; inset: 0; display: block; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 6px 18px 18px 6px; }
  .cover-front {
    background: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, .5) 1.5px, transparent 0) 0 0 / 18px 18px, linear-gradient(150deg, #FFB3C6, #F58FB0);
    box-shadow: 0 18px 40px rgba(194, 58, 99, .3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 22px;
  }
  .cover-front::before { content: ""; position: absolute; inset: 10px; border-radius: 4px 12px 12px 4px; border: 2px dashed rgba(255, 255, 255, .8); }
  .cv-flowers { width: 82%; height: auto; overflow: visible; }
  .cv-to { font-family: var(--font-script); font-size: 1.9rem; line-height: 1.4; color: #fff; text-shadow: 0 2px 0 rgba(194, 58, 99, .35); }
  .cv-hint { font-weight: 700; font-size: .9rem; color: #fff; background: rgba(194, 58, 99, .55); padding: 6px 14px; border-radius: 999px; }
  .cover-back { transform: rotateY(180deg); background: linear-gradient(150deg, #FFE3EA, #FFC9D6); border-radius: 18px 6px 6px 18px; }

  /* ---------- Thanh điều hướng ---------- */
  .main { position: relative; z-index: 1; }
  .main.enter { animation: enter 1.1s ease both; }
  @keyframes enter { from { opacity: 0; } to { opacity: 1; } }
  .nav {
    position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: calc(10px + env(safe-area-inset-top)) max(16px, 4vw) 10px;
    background: rgba(255, 241, 243, .84); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(238, 108, 139, .15);
  }
  .brand { font-family: var(--font-script); color: var(--rose-deep); text-decoration: none; white-space: nowrap; }
  .nav-links { display: flex; gap: clamp(10px, 3vw, 28px); }
  .nav-links a { color: var(--ink); font-weight: 700; font-size: .88rem; text-decoration: none; padding: 6px 2px; }
  .nav-links a:hover { color: var(--rose-deep); }
  .music { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; padding: 7px 13px; border-radius: 999px; border: 2px solid var(--petal); background: #fff; color: var(--rose-deep); font: 700 .85rem var(--font-body); }
  .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
  .eq i { width: 3px; height: 4px; border-radius: 2px; background: var(--rose-deep); }
  .music.on .eq i { animation: eq .9s ease-in-out infinite; }
  .music.on .eq i:nth-child(2) { animation-delay: .2s; } .music.on .eq i:nth-child(3) { animation-delay: .4s; }
  @keyframes eq { 0%, 100% { height: 4px; } 50% { height: 14px; } }
  @media (max-width: 420px) { .brand span, .music-t { display: none; } }

  /* ---------- Hero ---------- */
  .hero { position: relative; padding: 44px 20px 72px; text-align: center; background: linear-gradient(180deg, #FFE3EA 0%, rgba(255, 241, 243, 0) 100%); overflow: hidden; }
  .arch { position: relative; width: min(72vw, 300px); aspect-ratio: 3 / 4; margin: 0 auto; }
  .arch-frame { width: 100%; height: 100%; padding: 8px; background: #fff; border-radius: 999px 999px 28px 28px; box-shadow: 0 18px 38px rgba(194, 58, 99, .22); }
  .arch-img { width: 100%; height: 100%; overflow: hidden; border-radius: 999px 999px 21px 21px; background: var(--blush); }
  .arch-img img, .arch-img .ph { width: 100%; height: 100%; object-fit: cover; display: block; }
  .stamp-date {
    position: absolute; left: -14px; top: 26px; transform: rotate(-8deg); padding: 6px 14px; border-radius: 8px;
    background: #fff; color: var(--rose-deep); font-weight: 700; font-size: .9rem; box-shadow: 0 6px 14px rgba(194, 58, 99, .18);
  }
  .badge { position: absolute; right: -26px; bottom: 30px; width: 108px; height: 108px; display: grid; place-items: center; filter: drop-shadow(0 8px 12px rgba(194, 58, 99, .22)); }
  .badge svg { position: absolute; inset: 0; width: 100%; height: 100%; animation: spin 22s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .badge-c { position: relative; font-family: var(--font-script); font-size: 1.05rem; color: var(--rose-deep); }
  .hero-title { margin-top: 30px; font-family: var(--font-script); font-weight: 400; font-size: clamp(2.8rem, 13vw, 5.4rem); line-height: 1.25; color: var(--rose-deep); text-shadow: 0 4px 0 rgba(255, 255, 255, .8); }
  .hero-sub { max-width: 28em; margin: 10px auto 0; font-weight: 600; line-height: 1.75; font-size: clamp(1rem, 3.2vw, 1.15rem); }
  .chip-count { display: inline-block; margin-top: 18px; padding: 8px 18px; border-radius: 999px; background: #fff; color: var(--rose-deep); font-weight: 700; font-size: .92rem; box-shadow: 0 6px 16px rgba(194, 58, 99, .12); }
  .scroll-cue { display: block; margin: 24px auto 0; width: 28px; color: var(--rose-deep); animation: cue 1.8s ease-in-out infinite; }
  @keyframes cue { 0%, 100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(8px); opacity: 1; } }

  .ph { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: linear-gradient(135deg, #FFE3EA, #EADDFB); font-size: 2.6rem; text-align: center; }
  .ph small { font-size: .75rem; font-weight: 600; color: var(--ink-soft); padding: 0 12px; }

  /* ---------- Đoạn dừng ---------- */
  .s-interlude { background: linear-gradient(160deg, #7A4560 0%, #5A3B4B 100%); color: #fff; text-align: center; padding: clamp(76px, 15vw, 140px) 20px; }
  .s-interlude p { font-family: var(--font-script); font-size: clamp(1.5rem, 5.4vw, 2.5rem); line-height: 1.7; }
  .s-interlude p + p { color: #FFC9D6; }

  /* ---------- Cuộn phim (thẻ lật) ---------- */
  .s-film { background: linear-gradient(180deg, rgba(255, 241, 243, 0), #FDEAF4); }
  .strip { display: flex; gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 32px -20px 0; padding: 12px 20px 30px; -webkit-overflow-scrolling: touch; }
  .strip::-webkit-scrollbar { height: 6px; } .strip::-webkit-scrollbar-thumb { background: var(--petal); border-radius: 99px; }
  .fcard { flex: 0 0 min(66vw, 250px); aspect-ratio: 3 / 4; perspective: 1100px; padding: 0; border: 0; background: none; cursor: pointer; scroll-snap-align: center; font: inherit; color: inherit; margin: 0 auto; }
  .fin { position: relative; display: block; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.3, .8, .3, 1); }
  .fcard.flipped .fin { transform: rotateY(180deg); }
  .ff, .fb { position: absolute; inset: 0; display: block; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 16px; overflow: hidden; box-shadow: 0 12px 26px rgba(194, 58, 99, .18); }
  .ff { background: #fff; padding: 10px 10px 40px; }
  .fimg { display: block; width: 100%; height: 100%; border-radius: 10px; overflow: hidden; background: var(--blush); }
  .fimg img, .fimg .ph { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ftag { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-family: var(--font-script); font-size: .95rem; color: var(--rose-deep); }
  .fb { transform: rotateY(180deg); background: var(--paper); display: flex; align-items: center; justify-content: center; padding: 28px 22px; text-align: center; font-family: var(--font-script); line-height: 2; color: var(--ink); font-size: .98rem; }
  .fb::before { content: ""; position: absolute; inset: 8px; border-radius: 10px; border: 1.5px dashed var(--petal); }
  .hint { margin-top: 4px; text-align: center; font-weight: 600; font-size: .9rem; color: var(--ink-soft); }

  /* ---------- Bó hoa bí mật ---------- */
  .s-bouquet { background: linear-gradient(180deg, #FDEAF4 0%, #E9F6EF 55%, #FFF3E6 100%); }
  .bouquet { width: min(88vw, 380px); margin: 26px auto 0; }
  .bq { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 14px 16px rgba(194, 58, 99, .16)); }
  .bq-sway { transform-box: view-box; transform-origin: 180px 420px; animation: bqsway 6s ease-in-out infinite; }
  @keyframes bqsway { 0%, 100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
  .flower { cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }
  .flower .hit { stroke: transparent; stroke-width: 3; }
  .flower:focus-visible .hit { stroke: var(--rose-deep); stroke-dasharray: 6 5; }
  .flower.locked { opacity: .78; }
  .flower.wiggle { transform-box: fill-box; transform-origin: 50% 50%; animation: wiggle .5s; }
  @keyframes wiggle { 25% { transform: rotate(-7deg); } 75% { transform: rotate(7deg); } }
  .lock { pointer-events: none; }
  .pets, .core { transform: scale(.08); opacity: 0; transition: transform .9s cubic-bezier(.34, 1.56, .64, 1), opacity .5s ease; }
  .bud { transition: opacity .4s ease; animation: pulse 2.6s ease-in-out infinite; transform-origin: 0 0; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  .flower.bloom .pets { transform: scale(1) rotate(15deg); opacity: 1; }
  .flower.bloom .core { transform: scale(1); opacity: 1; }
  .flower.bloom .bud { opacity: 0; animation: none; }
  .gcount { margin-top: 10px; text-align: center; font-weight: 700; color: var(--ink-soft); }
  .gdone { margin: 22px auto 0; max-width: 24em; text-align: center; font-family: var(--font-script); font-size: 1.25rem; color: var(--rose-deep); line-height: 1.8; }

  /* ---------- Cửa sổ bất ngờ ---------- */
  .sheet { position: fixed; inset: 0; z-index: 300; display: flex; align-items: flex-end; justify-content: center; background: rgba(90, 59, 75, .5); opacity: 0; transition: opacity .3s ease; }
  .sheet.show { opacity: 1; }
  .sheet-card {
    position: relative; width: min(100%, 520px); max-height: 90vh; overflow: auto; background: var(--paper);
    border-radius: 26px 26px 0 0; padding: 30px 22px calc(26px + env(safe-area-inset-bottom));
    transform: translateY(44px); transition: transform .5s cubic-bezier(.2, .8, .2, 1);
  }
  .sheet.show .sheet-card { transform: none; }
  @media (min-width: 640px) { .sheet { align-items: center; } .sheet-card { border-radius: 26px; padding: 34px 30px; } }
  .sh-x { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--blush); color: var(--rose-deep); font-size: 1.5rem; line-height: 1; cursor: pointer; }
  .sh-title { font-family: var(--font-script); font-weight: 400; font-size: 1.5rem; color: var(--rose-deep); text-align: center; margin: 0 40px 16px; line-height: 1.5; }
  .sh-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 18px; }

  .wish { display: grid; font-size: 1.05rem; line-height: 1.85; font-weight: 500; min-height: 7.4em; }
  .wish > span { grid-area: 1 / 1; }
  .wish .full { color: transparent; user-select: none; }
  .sh-sign { text-align: right; font-family: var(--font-script); color: var(--rose-deep); min-height: 1.6em; }

  .scratch { position: relative; width: min(100%, 290px); aspect-ratio: 4 / 5; margin: 0 auto; border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 12px 26px rgba(194, 58, 99, .2); }
  .scratch-photo { position: absolute; inset: 0; }
  .scratch-photo img, .scratch-photo .ph { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scratch-cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; transition: opacity .9s ease; }
  .scratch-cv.gone { opacity: 0; pointer-events: none; }
  .scratch-cap { margin-top: 14px; text-align: center; font-family: var(--font-script); color: var(--rose-deep); line-height: 1.7; }

  .ticket { position: relative; background: linear-gradient(135deg, #FFF3C4, #FFE3EA); border-radius: 16px; padding: 26px 22px; text-align: center; border: 2px dashed var(--rose); }
  .ticket::before, .ticket::after { content: ""; position: absolute; top: 50%; width: 22px; height: 22px; border-radius: 50%; background: var(--paper); transform: translateY(-50%); }
  .ticket::before { left: -13px; } .ticket::after { right: -13px; }
  .tk-top { font-weight: 700; font-size: .9rem; color: var(--rose-deep); }
  .tk-title { font-family: var(--font-script); font-weight: 400; font-size: 1.4rem; line-height: 1.55; color: var(--plum); margin: 6px 0 10px; }
  .tk-detail { line-height: 1.8; font-weight: 600; }
  .tk-meta { margin-top: 10px; font-size: .85rem; font-weight: 600; color: var(--ink-soft); }
  .stamp { position: absolute; right: 14px; bottom: -14px; background: #FFFDFB; padding: 6px 14px; border: 3px solid var(--rose-deep); color: var(--rose-deep); border-radius: 10px; font-weight: 700; transform: rotate(-14deg) scale(1.9); opacity: 0; transition: transform .45s cubic-bezier(.3, 1.6, .5, 1), opacity .3s; pointer-events: none; }
  .ticket.used .stamp { opacity: .92; transform: rotate(-14deg) scale(1); }
  .tk-hint { margin-top: 14px; text-align: center; font-weight: 600; font-size: .9rem; color: var(--ink-soft); line-height: 1.7; }

  .jar-note { min-height: 140px; display: grid; place-items: center; padding: 22px; border-radius: 16px; background: var(--bg, #FFF3C4); font-weight: 700; line-height: 1.75; text-align: center; font-size: 1.08rem; box-shadow: 0 8px 18px rgba(90, 59, 75, .1); }
  .jar-note.flip { animation: flipin .6s ease; }
  @keyframes flipin { from { transform: rotateX(90deg) scale(.9); opacity: 0; } }
  .jar-count { margin-top: 12px; text-align: center; font-weight: 700; font-size: .9rem; color: var(--ink-soft); }

  .moods { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .mood { padding: 10px 15px; border-radius: 999px; border: 2px solid var(--petal); background: #fff; font: 700 .95rem var(--font-body); color: var(--ink); cursor: pointer; }
  .mood[aria-pressed="true"] { background: var(--rose-deep); border-color: var(--rose-deep); color: #fff; }
  .mood-reply { margin-top: 18px; min-height: 5.6em; }

  .letter { position: relative; text-align: left; background: #fff; border-radius: 16px; padding: 28px 24px 22px; box-shadow: inset 0 0 0 1px rgba(255, 201, 214, .5); }
  .letter::before { content: ""; position: absolute; inset: 7px; border-radius: 11px; border: 1.5px dashed var(--petal); pointer-events: none; }
  .l-date { font-size: .85rem; font-weight: 700; color: var(--ink-soft); text-align: right; }
  .l-greet { font-family: var(--font-script); font-size: 1.35rem; color: var(--rose-deep); margin: 6px 0 10px; }
  .l-p { line-height: 1.9; font-weight: 500; margin-bottom: 12px; }

  /* ---------- Hồi âm ---------- */
  .s-reply { background: linear-gradient(180deg, #FFF3E6, #FFE3EA); }
  .rcard { max-width: 560px; margin: 30px auto 0; background: var(--paper); border-radius: 20px; padding: 26px 22px; box-shadow: 0 16px 34px rgba(194, 58, 99, .14); }
  .rlabel { font-weight: 700; margin-bottom: 8px; }
  .rchips { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .rchip { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--petal); background: #fff; font-size: 1.5rem; line-height: 1; cursor: pointer; }
  .rchip[aria-pressed="true"] { background: var(--petal); border-color: var(--rose-deep); transform: scale(1.08); }
  .rmsg { width: 100%; min-height: 130px; padding: 14px; border-radius: 14px; border: 2px solid var(--petal); background: #fff; font: 500 1rem/1.7 var(--font-body); color: var(--ink); resize: vertical; }
  .rmsg:focus-visible { outline-offset: 1px; }
  .rcount { text-align: right; font-size: .8rem; font-weight: 600; color: var(--ink-soft); margin-top: 4px; }
  .rsend { display: block; margin: 16px auto 0; }
  .rstatus { margin-top: 12px; min-height: 1.6em; text-align: center; font-weight: 600; font-size: .92rem; color: var(--rose-deep); line-height: 1.6; }
  .rzalo { text-align: center; margin-top: 10px; }
  .rzalo .btn { display: inline-block; text-decoration: none; }
  .rlist { margin-top: 18px; display: grid; gap: 10px; }
  .rlist-h { margin-top: 22px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  .rlist-h button { background: none; border: 0; color: var(--ink-soft); font: 600 .85rem var(--font-body); text-decoration: underline; cursor: pointer; }
  .ritem { padding: 12px 14px; border-radius: 12px; background: var(--blush); line-height: 1.7; font-weight: 500; }
  .ritem small { display: block; color: var(--ink-soft); font-weight: 600; }

  /* ---------- Kết ---------- */
  .s-close { background: linear-gradient(180deg, #FFE3EA, #FFD3E0); text-align: center; padding: clamp(76px, 14vw, 120px) 20px calc(56px + env(safe-area-inset-bottom)); }
  .beats p { font-family: var(--font-script); font-size: clamp(1.8rem, 7vw, 3rem); line-height: 1.5; color: var(--rose-deep); }
  .close-note { margin-top: 26px; font-weight: 700; }
  .close-sub { margin: 6px 0 22px; font-weight: 600; font-size: .9rem; color: var(--ink-soft); }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); z-index: 400; max-width: min(90vw, 420px); padding: 12px 22px; border-radius: 22px; background: var(--plum); color: #fff; font-weight: 600; text-align: center; line-height: 1.5; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .fly { position: fixed; z-index: 500; pointer-events: none; animation: fly 1.6s ease-out forwards; }
  @keyframes fly { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(40deg); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .petals { display: none; }
    .card3d:not(.open), .badge svg, .scroll-cue, .bud, .bq-sway, .music.on .eq i, .main.enter, .flower.wiggle, .jar-note.flip { animation: none; }
    .card-cover, .fin, .pets, .core, .sheet, .sheet-card, .stamp, .scratch-cv, .intro { transition: none; }
  }
</style>
</head>

  const $ = id => document.getElementById(id);

  const FX = ['🌸', '💗', '✨', '🌷'];
  function confetti(cx, cy, n, spread) {
    if (reduce) return;
    for (let i = 0; i < n; i++) {
      const s = el('span', 'fly', FX[i % FX.length]);
      s.style.left = cx + 'px'; s.style.top = cy + 'px';

      document.body.appendChild(s);
      s.addEventListener('animationend', () => s.remove());

  }
  const centerOf = node => { const r = node.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  let toastT;

  /* ---------- Chữ gõ dần ---------- */

      node,
      stop() { clearInterval(t); },
      type(text) {
        clearInterval(t);
        full.textContent = text;
        if (reduce) { typed.textContent = text; return; }
        typed.textContent = '';
        let n = 0;
        t = setInterval(() => { n++; typed.textContent = text.slice(0, n); if (n >= text.length) clearInterval(t); }, 26);
      }

  }

    if (sheet.hidden) return;

  /* --- 2. Ảnh cào --- */
  let scratched = false;
  function buildScratch(body) {
    const wrap = el('div', 'scratch');
    const ph = el('div', 'scratch-photo');
    ph.appendChild(makeImg(CONFIG.bloomPhoto.src, CONFIG.bloomPhoto.caption || '', 'Thêm ảnh vào ' + CONFIG.bloomPhoto.src));
    const cv = el('canvas', 'scratch-cv');
    cv.setAttribute('aria-hidden', 'true');
    wrap.append(ph, cv);
    const capEl = el('p', 'scratch-cap', CONFIG.bloomPhoto.caption || '');
    const skip = el('button', 'link-btn', 'Hiện luôn');
    skip.type = 'button';
    body.append(wrap, capEl, skip);

    let ctx, dpr = 1, drawing = false, done = scratched, moves = 0;
    function reveal() {
      if (done && cv.classList.contains('gone')) return;
      done = true; scratched = true;
      cv.classList.add('gone'); skip.hidden = true;
      const [cx, cy] = centerOf(wrap);
      confetti(cx, cy, 14, 120);
    }
    function paint() {
      if (done) { cv.classList.add('gone'); skip.hidden = true; return; }
      const r = cv.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.max(1, Math.round(r.width * dpr));
      cv.height = Math.max(1, Math.round(r.height * dpr));
      ctx = cv.getContext('2d', { willReadFrequently: true });
      const g = ctx.createLinearGradient(0, 0, cv.width, cv.height);
      g.addColorStop(0, '#F9A8C9'); g.addColorStop(.5, '#DCCBF7'); g.addColorStop(1, '#FFC9D6');
      ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      ctx.font = (20 * dpr) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const step = 44 * dpr;
      for (let y = step / 2, row = 0; y < cv.height; y += step, row++) {
        for (let x = (row % 2 ? 0 : step / 2); x < cv.width + step; x += step) ctx.fillText('♥', x, y);
      }
      ctx.fillStyle = '#fff';
      ctx.font = '700 ' + (26 * dpr) + 'px Quicksand, sans-serif';
      ctx.fillText('Cào nhẹ nhé', cv.width / 2, cv.height / 2);
    }
    function pos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * dpr, (e.clientY - r.top) * dpr]; }
    function scratchAt(e) {
      if (!drawing || done || !ctx) return;
      const [x, y] = pos(e);
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath(); ctx.arc(x, y, 24 * dpr, 0, Math.PI * 2); ctx.fill();
      if (++moves % 14 === 0) check();
    }
    function check() {
      if (done || !ctx) return;
      const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
      let clear = 0, total = 0;
      for (let i = 3; i < d.length; i += 4 * 61) { total++; if (d[i] === 0) clear++; }
      if (total && clear / total > 0.5) reveal();
    }
    cv.addEventListener('pointerdown', e => { drawing = true; try { cv.setPointerCapture(e.pointerId); } catch (_) {} scratchAt(e); });
    cv.addEventListener('pointermove', scratchAt);
    cv.addEventListener('pointerup', () => { drawing = false; check(); });
    cv.addEventListener('pointercancel', () => { drawing = false; });
    skip.addEventListener('click', reveal);
    return { onShow: paint };
  }

  // Vị trí từng bông trong bó (x, y, kích cỡ). Thứ tự khớp với TYPES; bông vàng nằm giữa phía trên.
  const BQ = [
    { x: 112, y: 124, s: 1.15 },  // lời chúc
    { x: 248, y: 124, s: 1.15 },  // ảnh cào
    { x: 80,  y: 192, s: 1.1 },   // phiếu

  const BQ_COLORS = ['#FFB3C6', '#DCCBF7', '#FFD2B8', '#BFE8D6', '#F9A8C9', '#FFD66B'];
  const BQ_ORDER = [5, 0, 1, 2, 3, 4];     // vẽ từ trên xuống để hàng dưới đè lên hàng trên

  function bouquetSVG() {
    let petals = '';
    for (let a = 0; a < 360; a += 45) petals += '<ellipse cx="0" cy="-17" rx="8" ry="14" transform="rotate(' + a + ')"/>';
    let stems = '';
    BQ.forEach(f => {
      stems += '<path d="M' + f.x + ' ' + f.y + ' Q' + (f.x + (180 - f.x) * 0.15) + ' ' + ((f.y + 252) / 2) + ' 180 252" />';
    });
    let heads = '';
    BQ_ORDER.forEach(i => {
      const f = BQ[i], gold = i === 5;
      heads += '<g class="flower' + (gold ? ' locked' : '') + '" data-i="' + i + '" role="button" tabindex="0" aria-label="' +
        (gold ? 'Bông vàng, đang khóa. Hãy mở 5 bông kia trước.' : 'Bông hoa số ' + (i + 1) + ', chạm để nở') + '">' +
        '<g transform="translate(' + f.x + ' ' + f.y + ') scale(' + f.s + ')">' +
        '<circle class="hit" r="36" fill="transparent"/>' +
        '<ellipse class="bud" cx="0" cy="0" rx="9" ry="14" fill="' + BQ_COLORS[i] + '"/>' +
        '<g class="pets" fill="' + BQ_COLORS[i] + '">' + petals + '</g>' +
        '<circle class="core" r="9" fill="' + (gold ? '#FFFFFF' : '#FFD66B') + '"/>' +
        (gold ? '<text class="lock" x="0" y="7" text-anchor="middle" font-size="18">🔒</text>' : '') +
        '</g></g>';
    });
    return '<svg class="bq" viewBox="0 0 360 430" role="group" aria-label="Bó hoa bí mật gồm 6 bông hoa">' +
      '<g class="bq-sway">' +
      '<g fill="#9AD7B5"><path d="M152 240 q-50 -4 -66 -44 q44 -6 66 44z"/><path d="M208 240 q50 -4 66 -44 q-44 -6 -66 44z"/><path d="M180 236 q-14 -34 0 -70 q14 36 0 70z"/></g>' +
      '<g fill="none" stroke="#7FC4A0" stroke-width="4" stroke-linecap="round">' + stems + '</g>' +
      '<path d="M72 232 Q180 264 288 232 L208 424 L152 424 Z" fill="#FFC9D6"/>' +
      '<path d="M92 240 Q180 270 268 240 L180 336 Z" fill="#FFB3C6" opacity=".55"/>' +
      '<path d="M96 244 L180 336 L264 244 L208 424 L152 424 Z" fill="#FFE3EA"/>' +
      '<g fill="none" stroke="#EE6C8B" stroke-width="6" stroke-linecap="round"><path d="M176 346 q-10 26 -28 40"/><path d="M184 346 q10 26 28 40"/></g>' +
      '<g fill="#EE6C8B"><ellipse cx="154" cy="336" rx="26" ry="13" transform="rotate(-18 154 336)"/><ellipse cx="206" cy="336" rx="26" ry="13" transform="rotate(18 206 336)"/><circle cx="180" cy="340" r="9" fill="#C23A63"/></g>' +
      heads + '</g></svg>';
  }

  const updateCount = () => { $('gcount').textContent = 'Đã mở ' + opened.size + '/' + TYPES.length + ' bông'; };
  updateCount();

  function openFlower(i, b) {
    const t = TYPES[i];
    const first = !b.classList.contains('bloom');
    b.classList.add('bloom');
    b.setAttribute('aria-label', 'Bông hoa số ' + (i + 1) + ', chạm để xem lại');
    if (first) { const [cx, cy] = centerOf(b); confetti(cx, cy, 7, 80); }
    const go = () => openSheet(TITLES[t](), BUILD[t], b);
    if (first && !reduce) setTimeout(go, 700); else go();
    if (!first) return;
    opened.add(t);
    updateCount();
    if (!unlocked && [...opened].filter(x => x !== 'letter').length >= 5) {
      unlocked = true;
      const gold = flowers[5];
      gold.classList.remove('locked');
      const lk = gold.querySelector('.lock'); if (lk) lk.remove();
      gold.setAttribute('aria-label', 'Bông vàng đã sẵn sàng, chạm để mở');
      pendingToast = 'Bông vàng đã sẵn sàng. Chạm để mở lá thư nhé.';
    }
    if (t === 'letter') {
      $('gdone').textContent = mode === 'me' ? 'Bó hoa đã nở rộ rồi. Con thương ' + to + ' nhiều lắm.' : 'Bó hoa đã nở rộ rồi. Cảm ơn ' + to + ' vì đã mở hết nhé.';
      $('gdone').hidden = false;
      setTimeout(() => confetti(window.innerWidth / 2, window.innerHeight * 0.6, 26, Math.min(260, window.innerWidth / 2 - 20)), 900);
    }
  }

  (() => {
    $('garden').innerHTML = bouquetSVG();
    $('garden').querySelectorAll('.flower').forEach(b => {
      const i = +b.dataset.i;
      flowers[i] = b;
      const act = () => {
        if (b.classList.contains('locked')) {
          toast('Hãy mở 5 bông kia trước, bông vàng sẽ nở sau cùng nhé.');
          b.classList.remove('wiggle'); b.getBoundingClientRect(); b.classList.add('wiggle');
          return;
        }
        openFlower(i, b);
      };
      b.addEventListener('click', act);
      b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } });
    });
  })();

  /* ---------- Hồi âm ---------- */
  const STORE = 'hoi-am-20-10';
  let rMood = '';
  const chipIcons = ['😊', '🥰', '🥹', '😴', '😆'];
  function setReplyMood(icon) {
    rMood = icon;
    $('rchips').querySelectorAll('.rchip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.icon === icon)));
  }
  chipIcons.forEach(icon => {
    const c = el('button', 'rchip', icon);
    c.type = 'button'; c.dataset.icon = icon; c.setAttribute('aria-pressed', 'false'); c.setAttribute('aria-label', 'Tâm trạng ' + icon);
    c.addEventListener('click', () => { const same = rMood === icon; setReplyMood(same ? '' : icon); state.mood = same ? '' : icon; });
    $('rchips').appendChild(c);
  });
  $('rMsg').addEventListener('input', () => { $('rCount').textContent = $('rMsg').value.length + '/500'; });

  const loadReplies = () => { try { return JSON.parse(localStorage.getItem(STORE) || '[]'); } catch (_) { return []; } };
  const saveReplies = list => { try { localStorage.setItem(STORE, JSON.stringify(list)); } catch (_) {} };
  function renderReplies() {
    const list = loadReplies();
    $('rList').replaceChildren();
    $('rListH').hidden = list.length === 0;
    list.slice().reverse().forEach(r => {
      const it = el('div', 'ritem', (r.mood ? r.mood + ' ' : '') + r.text);
      it.appendChild(el('small', null, new Date(r.t).toLocaleDateString('vi-VN')));
      $('rList').appendChild(it);
    });
  }
  renderReplies();
  $('rClear').addEventListener('click', () => { saveReplies([]); renderReplies(); });

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(() => true, () => legacyCopy(text));
    return Promise.resolve(legacyCopy(text));
  }
  function legacyCopy(text) {
    const ta = el('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;top:0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove(); return ok;
  }

  function zaloUrl() {
    const fromParam = (params.get('zalo') || '').trim();
    if (fromParam) {
      const id = fromParam.replace(/^https?:\/\/zalo\.me\//i, '').replace(/^\+/, '');
      if (/^\d[\d\s.-]{7,14}$/.test(id)) return 'https://zalo.me/' + id.replace(/\D/g, '');
      if (/^[A-Za-z0-9_.-]{3,40}$/.test(id)) return 'https://zalo.me/' + id;
      return '';
    }
    const raw = (CONFIG.zalo || '').trim();
    if (!raw) return '';
    if (/^https:\/\/(chat\.)?zalo\.me\//i.test(raw)) return raw;
    const id = raw.replace(/^\+/, '');
    if (/^\d[\d\s.-]{7,14}$/.test(id)) return 'https://zalo.me/' + id.replace(/\D/g, '');
    if (/^[A-Za-z0-9_.-]{3,40}$/.test(id)) return 'https://zalo.me/' + id;
    return '';
  }
  const ZALO = zaloUrl();
  if (ZALO) $('rSend').textContent = 'Gửi qua Zalo';

  $('rSend').addEventListener('click', async () => {
    const text = $('rMsg').value.trim();
    const status = $('rStatus');
    if (!text && !rMood) { status.textContent = 'Hãy viết vài chữ hoặc chọn một biểu tượng nhé.'; $('rMsg').focus(); return; }
    const msg = (rMood ? rMood + ' ' : '') + text + '\n– ' + cap(to) + ' (hồi âm 20/10 🌸)';
    const list = loadReplies(); list.push({ mood: rMood, text, t: Date.now() }); saveReplies(list); renderReplies();
    if (ZALO) {
      const copied = copyText(msg);                       // chép ngay trong lúc bấm nút
      window.open(ZALO, '_blank', 'noopener');
      const ok = await copied;
      status.textContent = ok
        ? 'Đã chép lời nhắn và đang mở Zalo. Hãy dán vào khung chat rồi bấm gửi nhé.'
        : 'Đang mở Zalo. Chưa chép được lời nhắn, hãy tự chép đoạn vừa viết rồi dán vào khung chat nhé.';
      $('zaloLink').href = ZALO; $('zaloLink').hidden = false;
      return;
    }
    if (navigator.share) {
      try { await navigator.share({ text: msg }); status.textContent = 'Chọn Zalo hoặc Messenger trong khung chia sẻ để gửi đi nhé.'; return; }
      catch (e) { if (e && e.name === 'AbortError') { status.textContent = 'Chưa gửi đi. Lời nhắn vẫn được lưu ở bên dưới.'; return; } }
    }
    const ok = await copyText(msg);
    status.textContent = ok ? 'Đã chép lời nhắn. Dán vào Zalo hoặc Messenger để gửi nhé.' : 'Chưa chép được. Bạn hãy tự chép đoạn vừa viết rồi gửi nhé.';
  });

  $('toTop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }));

  /* ---------- Nhạc ---------- */
  const audio = new Audio();
  audio.src = CONFIG.musicSrc || ('data:audio/mpeg;base64,' + $('musicData').textContent.trim());
  audio.loop = true; audio.preload = 'auto';
  const musicBtn = $('musicBtn');
  musicBtn.title = CONFIG.musicTitle;
  function setMusic(on) {
    musicBtn.classList.toggle('on', on);
    musicBtn.setAttribute('aria-pressed', String(on));
    musicBtn.setAttribute('aria-label', on ? 'Tắt nhạc' : 'Bật nhạc');
  }
  audio.addEventListener('play', () => setMusic(true));
  audio.addEventListener('pause', () => setMusic(false));
  audio.addEventListener('error', () => { musicBtn.title = CONFIG.musicSrc ? 'Chưa tìm thấy file nhạc: ' + CONFIG.musicSrc : 'Không phát được nhạc'; });
  musicBtn.addEventListener('click', () => { if (audio.paused) audio.play().catch(() => {}); else audio.pause(); });

  /* ---------- Mở thiệp (chạm hoặc tự mở sau vài giây) ---------- */
  let opening = false, autoTimer = null;
  function openCard(auto) {
    if (opening) return;
    opening = true;
    clearTimeout(autoTimer);
    // Trình duyệt chỉ cho phát nhạc sau khi người dùng chạm vào trang.
    // Khi thiệp tự mở thì nhạc có thể bị chặn, lúc đó nhắc người xem bật nhạc bằng nút ở góc trên.
    audio.play().catch(() => { if (auto) pendingMusicHint = true; });
    $('card3d').classList.add('open');
    $('coverBtn').setAttribute('aria-label', 'Thiệp đã mở');
    setTimeout(() => {
      const intro = $('intro'), main = $('main');
      main.hidden = false;
      main.classList.add('enter');
      document.body.classList.remove('locked');
      intro.classList.add('hide');
      window.scrollTo(0, 0);
      setTimeout(() => intro.remove(), reduce ? 0 : 950);
      if (pendingMusicHint && audio.paused) setTimeout(() => toast('Chạm nút nhạc ở góc trên để bật nhạc nhé.'), 1200);
    }, reduce ? 200 : 2000);
  }
  let pendingMusicHint = false;
  $('coverBtn').addEventListener('click', () => openCard(false));
  if (CONFIG.autoOpenSeconds > 0) autoTimer = setTimeout(() => openCard(true), CONFIG.autoOpenSeconds * 1000);
})();
</script>
</body>
</html>
